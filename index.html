<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slick Games | Daily BetPawa Tips for Uganda</title>
<meta name="description" content="Daily BetPawa tips for Uganda. Every pick is scored on a 6-rule check. New picks every day at midnight and midday.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1810; --panel:#12251a; --panel-2:#17301f; --line:#1f3a2b;
  --gold:#f4c430; --text:#eaf1ec; --muted:#8fa596; --ok:#7fd69a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Noto Serif',Georgia,'Times New Roman',serif;line-height:1.6;font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header{text-align:center;padding:36px 0 26px;border-bottom:3px solid var(--gold)}
h1{margin:0 0 10px;font-size:2.4rem;line-height:1.1;font-weight:700}
h1 span{color:var(--gold)}
header p{margin:0 auto;color:var(--muted);max-width:30ch}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 16px}
.tab{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 6px;cursor:pointer;text-align:center}
.tab small{display:block;color:var(--muted);font-size:.8rem}
.tab[aria-selected="true"]{border-color:var(--gold);background:var(--panel-2)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--muted)}
.total{margin:0 0 12px;color:var(--muted)}
.total b{color:var(--gold);font-size:1.15rem}
.tab .n{color:var(--gold)}
.game{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.game .meta{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.game .teams{font-weight:600;font-size:1.1rem}
.game .pick{margin-top:8px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.game .pick b{color:var(--gold)}
.game .odd{font-weight:700;color:var(--gold);font-size:1.15rem}
.game .score{margin-top:6px;font-size:.88rem;color:var(--ok)}
.game .missed{color:var(--muted)}
.game .extra{margin-top:6px;font-size:.88rem;color:var(--muted)}
.game .extra b{color:var(--text)}
h2{color:var(--gold);font-size:1.45rem;margin:34px 0 12px}
ol.rules{padding-left:1.3rem;margin:0}
ol.rules li{margin-bottom:10px}
.note{color:var(--muted);font-size:.92rem;margin-top:14px}
.ranks{margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.95rem}
.ranks li{margin-bottom:4px}
.vip{background:var(--panel);border:1px solid var(--gold);border-radius:14px;
  padding:26px 20px;text-align:center;margin:34px 0}
.vip h2{margin:0 0 8px}
.vip p{margin:0 0 18px}
.btn{display:inline-block;background:var(--gold);color:#1b1500;text-decoration:none;
  font-weight:700;padding:13px 22px;border-radius:9px}
.
