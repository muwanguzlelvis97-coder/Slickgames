name: Fetch games

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'   # midnight Kampala
    - cron: '0 9 * * *'    # midday Kampala

permissions:
  contents: write

concurrency:
  group: fetch-games
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch games
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch.mjs
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/games.json
          git diff --staged --quiet || git commit -m "Update games"
          git pull --rebase -X theirs origin main
          git push
