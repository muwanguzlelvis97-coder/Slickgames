name: Probe football-data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-games
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run probe
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/probe_fd.mjs
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/probe_fd.json
          git diff --staged --quiet || git commit -m "Probe football-data results"
          git pull --rebase -X theirs origin main
          git push
